rubrica: 'Padre Las Casas (zona F) con PDA Temuco DS 8/2023 Art. 27: Tabla N°10 (0,28/0,45/0,50/3,20/1,70), Tabla N°11 R100,
  5 ach (Tabla N°12, del plan), permeabilidad clase 2 (Tabla N°13), ventanas además % Res. Ex. 9868; condensación HR 76 %
