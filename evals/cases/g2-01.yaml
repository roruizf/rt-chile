pregunta: Vivienda nueva de un piso, 92 m², en Padre Las Casas (La Araucanía). Muros de albañilería confinada con aislación,
  techumbre de zinc sobre estructura de madera, ventanas de PVC. El arquitecto insiste en que basta con cumplir el DS 15 porque
  "es la norma más nueva". ¿Qué exigencias térmicas aplican realmente y con qué tabla y artículo? Dame U, R100 y ventanas.
  Y si el mismo proyecto se construyera en Nueva Imperial, ¿cambia algo?
