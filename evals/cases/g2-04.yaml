id: g2-04
categoria: supuestos
critical: true
pregunta: 'Muro perimetral con estas capas, de interior a exterior: yeso-cartón 12,5 mm, OSB 11 mm, EPS 40 mm, albañilería
  de ladrillo 140 mm, yeso 15 mm. Dame el U del complejo y dime si cumple en zona D. Si te faltan datos, declara los supuestos.
  Y aparte: fachada poniente de 12 m² con 3 ventanas de 1,5 × 1,2 m, ¿cumple el porcentaje de ventanas y qué Upvm necesito?'
esperado:
  hechos:
  - descripcion: Declara supuestos de λ
    patrones:
    - supuest
  - descripcion: Usa Rsi 0,13
    patrones:
    - R_?\{?si\}?[^\n]{0,50}0[,.]13
  - descripcion: Usa Rse 0,04
    patrones:
    - R_?\{?se\}?[^\n]{0,50}0[,.]04
  - descripcion: Exigencia muro zona D 0,80
    patrones:
    - 0[,.]80
  - descripcion: Ventanas 5,4 m² = 45 %
    patrones:
    - 45\s*%|5[,.]4
  - descripcion: Depende del U de la ventana (Tabla 3 D Poniente)
    patrones:
    - \b(60|53|49|44)\b
  - descripcion: Upvm Tabla 5
    patrones:
    - Upvm
  citas:
  - Tabla\s*1\b
  - Tabla\s*3
  prohibidos: []
  cierre: true
rubrica: 'U = 1/(Rsi 0,13 + Σe/λ + Rse 0,04) con λ declarados como supuestos (sin tabla NCh 853); muro zona D U ≤ 0,80 (Tabla
  1); un muro con 40 mm EPS normalmente cumple pero depende de λ. Ventanas: 3×1,8 = 5,4 m² / 12 m² = 45 %; zona D Poniente
  (O-P): U≤2,8 → 60 % cumple; U≤3,6 → 53 % cumple; U≤4,0 → 49 % cumple; U≤4,4 → 44 % NO cumple; U≤5,8 → 15 % NO. Upvm (Tabla
  5, D O-P) depende de Uv y Um: debe pedir el U de la ventana o dar escenarios (un ejemplo con Uv 3,6 dentro de los escenarios
  es válido: D O-P 1,81/2,00/2,28 para Uv ≤2,4/2,8/3,6). Es correcto y no obligatorio agregar que la vía aislante rotulado
  exige R100 ≥125 en zona D (Tabla 2) y que 40 mm de EPS no la alcanzan, por lo que se acredita por cálculo, ensayo o LOSCAT;
  si la vivienda está en un PDA (no indicado) mandan las tablas del plan.'
