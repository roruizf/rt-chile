id: g2-05
categoria: trampa
critical: true
pregunta: Me dijeron que como el DS 15 es posterior al PDA de Temuco, ahora manda el DS 15 y el plan ya no se aplica. Además
  el arquitecto dice que con la CEV del DS 5/2024 se acredita todo el 4.1.10, y que si no me alcanza el U compenso poniendo
  más ventanas de doble vidrio. El constructor quiere además presentar el ensayo de infiltración en el permiso para no atrasar
  la recepción. ¿Está todo bien así?
esperado:
  hechos:
  - descripcion: PDA prevalece en vivienda (inc. 2°); DS 8/2023 es posterior
    patrones:
    - inc(iso)?\.?\s*2|prevalec|manda el (plan|PDA)
  - descripcion: CEV DS 5 no acredita el 4.1.10
    patrones:
