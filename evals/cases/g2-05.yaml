  citas: []
  prohibidos:
  - s[ií],? (est[aá] (todo )?bien|es correcto)
  cierre: true
rubrica: 'Las 4 premisas son falsas: (1) en vivienda manda el PDA (Art. 4.1.10 inc. 2°) y además el DS 8/2023 (D.O. 07-03-2025)
  es posterior al DS 15; (2) la CEV del DS 5/2024 es otro régimen; la vía por demanda del 4.1.10 es solo A, solo vivienda
  y su umbral está pendiente; (3) no hay compensación entre elementos: cada uno cumple su U; mejor U de ventana solo permite
  más % (Res. 9868); (4) el ensayo NCh 3295 es con obra terminada, en la recepción.'
